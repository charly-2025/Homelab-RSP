services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    volumes:
      - ./data/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./immich/.env
    environment:
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
    depends_on:
      - immich-redis
      - immich-db
    networks:
      - homelab_network

  immich-redis:
    image: redis:6.2-alpine
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - homelab_network

  immich-db:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    volumes:
      - ./data/immich/db:/var/lib/postgresql/data
    networks:
      - homelab_network

  nextcloud-db:
    image: mariadb:11
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ./data/nextcloud/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    networks:
      - homelab_network

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
    volumes:
      - ./data/nextcloud/html:/var/www/html
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: your-machine.your-tailnet.ts.net
    networks:
      - homelab_network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - homelab_network

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ./data/vaultwarden:/data
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "true"
    networks:
      - homelab_network

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      TZ: Europe/Paris
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_webserver_paths_prefix: /pihole
      DNSMASQ_LISTENING: all

    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
      - ./data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d

    ports:
      - "53:53/tcp"
      - "53:53/udp"

    cap_add:
      - NET_ADMIN

    networks:
      - homelab_network
  
  netdata:
    build:
      context: ./netdata
    image: homelab-netdata
    container_name: netdata
    hostname: homelab
    restart: unless-stopped

    pid: host

    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    volumes:
      - ./data/netdata/config:/etc/netdata
      - ./data/netdata/lib:/var/lib/netdata
      - ./data/netdata/cache:/var/cache/netdata

      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - homelab_network


  wol-service:
    build:
      context: ./wol-service
    container_name: wol-service
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env

  backend:
    build:
      context: ./site/backend
    container_name: remote-wakeup-backend
    restart: unless-stopped
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/gpiochip0:/dev/gpiochip0"
    volumes:
      - ./data/site/backend:/data
      - /proc/device-tree:/proc/device-tree:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab_network

  frontend:
    build:
      context: ./site/frontend
    container_name: remote-wakeup-frontend
    restart: unless-stopped
    networks:
      - homelab_network  



  nginx:
     build:
       context: ./nginx
     container_name: homelab-nginx
     restart: unless-stopped
     ports:
       - "80:80"
       - "443:443"
  
     volumes:
       - ./nginx/certs:/etc/nginx/certs:ro
       - ./nginx/conf.d:/etc/nginx/conf.d:ro
     networks:
       - homelab_network

  # authelia:
  #    image: authelia/authelia:latest
  #    container_name: authelia
  #    restart: unless-stopped

  #    volumes:
  #      - ./data/authelia/config:/config

  #    environment:
  #      TZ: Europe/Paris

  #    networks:
  #      - homelab_network


networks:
  homelab_network:
    external: true
