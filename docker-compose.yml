services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - homelab_network

  wol-service:
    build:
      context: ./wol-service
    container_name: wol-service
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env

  backend:
    build:
      context: ./site/backend
    container_name: remote-wakeup-backend
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - homelab_network

  frontend:
    build:
      context: ./site/frontend
    container_name: remote-wakeup-frontend
    restart: unless-stopped
    networks:
      - homelab_network  


  nginx:
    build:
      context: ./nginx
    container_name: homelab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - homelab_network

networks:
  homelab_network:
    external: true
