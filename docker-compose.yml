services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - homelab_network

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ./data/vaultwarden:/data
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "true"
    networks:
      - homelab_network

  netdata:
    build:
      context: ./netdata
    image: homelab-netdata
    container_name: netdata
    hostname: homelab
    restart: unless-stopped

    pid: host

    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN

    security_opt:
      - apparmor:unconfined

    volumes:
      - ./data/netdata/config:/etc/netdata
      - ./data/netdata/lib:/var/lib/netdata
      - ./data/netdata/cache:/var/cache/netdata

      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - homelab_network


  wol-service:
    build:
      context: ./wol-service
    container_name: wol-service
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env

  backend:
    build:
      context: ./site/backend
    container_name: remote-wakeup-backend
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/site/backend:/data
    networks:
      - homelab_network

  frontend:
    build:
      context: ./site/frontend
    container_name: remote-wakeup-frontend
    restart: unless-stopped
    networks:
      - homelab_network  


  nginx:
    build:
      context: ./nginx
    container_name: homelab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - homelab_network

networks:
  homelab_network:
    external: true
