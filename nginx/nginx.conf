events {}

http {

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    server {

        listen 80 default_server;
        server_name _;

        return 301 https://your-machine.your-tailnet.ts.net$request_uri;
    }


    server {

        listen 443 ssl;
        server_name your-machine.your-tailnet.ts.net;


        ssl_certificate /etc/nginx/certs/your-machine.your-tailnet.ts.net.crt;
        ssl_certificate_key /etc/nginx/certs/your-machine.your-tailnet.ts.net.key;


        include /etc/nginx/conf.d/*.location;

    }

	server {

            listen 8443 ssl;
            server_name your-machine.your-tailnet.ts.net;

            ssl_certificate /etc/nginx/certs/your-machine.your-tailnet.ts.net.crt;
            ssl_certificate_key /etc/nginx/certs/your-machine.your-tailnet.ts.net.key;

            client_max_body_size 50000M;
            proxy_read_timeout 600s;

            set $upstream_immich immich-server:2283;
            location / {
                proxy_pass http://$upstream_immich;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

     }

}

